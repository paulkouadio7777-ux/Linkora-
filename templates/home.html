<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Linkora</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/linkora.css') }}"
    >
</head>

<body>

    <!-- BARRE DU HAUT -->
    <header class="topbar">

        <a href="/" class="brand">

            <span class="brand-icon">
                L
            </span>

            <span class="brand-name">
                Linkora
            </span>

        </a>


        <div class="top-actions">

            <button
                class="icon-button"
                type="button"
            >
                🔍
            </button>

            <button
                class="icon-button"
                type="button"
            >
                ♡
            </button>

        </div>

    </header>


    <!-- CONTENU -->
    <main class="main-content">

        <!-- INTRODUCTION -->
        <section class="welcome">

            <h1>
                Pour vous ✨
            </h1>

            <p>
                Découvrez ce qui se passe sur Linkora.
            </p>

        </section>


        <!-- CRÉATION DE PUBLICATION -->
        <section class="card">

            <div class="composer">

                <div class="avatar">
                    L
                </div>

                <div class="composer-content">

                    <input
                        class="post-input"
                        type="text"
                        placeholder="Quoi de neuf sur Linkora ?"
                    >

                    <div class="post-actions">

                        <button type="button">
                            📷 Photo
                        </button>

                        <button type="button">
                            🎥 Vidéo
                        </button>

                        <button type="button">
                            😊 Humeur
                        </button>

                        <button
                            type="button"
                            class="publish"
                        >
                            Publier
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- MOMENTS -->
        <section>

            <div class="section-title">

                <h2>
                    Moments
                </h2>

                <a href="#">
                    Voir tout
                </a>

            </div>


            <div class="moments">

                <div class="moment add">

                    <div class="moment-plus">
                        +
                    </div>

                    <div class="moment-name">
                        Ajouter
                    </div>

                </div>


                <div class="moment">

                    <div class="moment-plus">
                        A
                    </div>

                    <div class="moment-name">
                        Alex
                    </div>

                </div>


                <div class="moment">

                    <div class="moment-plus">
                        M
                    </div>

                    <div class="moment-name">
                        Maya
                    </div>

                </div>


                <div class="moment">

                    <div class="moment-plus">
                        K
                    </div>

                    <div class="moment-name">
                        Kevin
                    </div>

                </div>

            </div>

        </section>


        <!-- PUBLICATIONS -->
        <section>

            <div class="section-title">

                <h2>
                    Publications
                </h2>

                <a href="#">
                    Pour vous ▾
                </a>

            </div>


            <article class="post">

                <div class="post-user">

                    <div class="avatar">
                        B
                    </div>

                    <div>

                        <strong>
                            Black Friday
                        </strong>

                        <small>
                            @blackfriday · il y a 15 min
                        </small>

                    </div>

                </div>


                <p class="post-text">
                    Bienvenue sur Linkora 🚀
                </p>


                <div class="post-buttons">

                    <button type="button">
                        🤍 J'aime
                    </button>

                    <button type="button">
                        💬 Commenter
                    </button>

                    <button type="button">
                        🔄 Reposter
                    </button>

                    <button type="button">
                        ↗ Partager
                    </button>

                </div>

            </article>

        </section>

    </main>


    <!-- NAVIGATION DU BAS -->
    <nav class="bottom-navigation">

        <a
            href="/"
            class="nav-item active"
        >

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Accueil
            </span>

        </a>


        <a
            href="#"
            class="nav-item"
        >

            <span class="nav-icon">
                ◇
            </span>

            <span>
                Explorer
            </span>

        </a>


        <button
            class="create-button"
            type="button"
        >
            ＋
        </button>


        <a
            href="#"
            class="nav-item"
        >

            <span class="nav-icon">
                ◌
            </span>

            <span>
                Messages
            </span>

        </a>


        <a
            href="#"
            class="nav-item"
        >

            <span class="nav-icon">
                ○
            </span>

            <span>
                Profil
            </span>

        </a>

    </nav>

</body>

    </html>
